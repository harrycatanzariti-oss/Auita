[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiuta"
dynamic = ["version"]
description = "A voice helper that takes an older person where they need to go on their computer."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
# The free version needs nothing beyond Python itself.
dependencies = []

[project.optional-dependencies]
# The AI agent: Claude for Plus (Basic/Nova needs nothing extra), and screen reading on Windows.
agent = ["anthropic", "uiautomation; sys_platform == 'win32'"]
dev = ["pytest"]

[project.scripts]
aiuta = "aiuta.__main__:main"

[tool.setuptools]
packages = ["aiuta"]

[tool.setuptools.dynamic]
version = { attr = "aiuta.__version__" }

[tool.setuptools.package-data]
aiuta = ["web/*", "locales/*.json"]
